name: Build IPA (Direct Release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write 

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 自动匹配最新 Xcode 26 环境
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "正在切换到: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: 解压、自动修复代码冲突并编译
        run: |
          # 1. 解压 zip 并清理 Mac 隐藏垃圾文件
          find . -maxdepth 2 -iname "*.zip" -exec unzip -o -q "{}" \;
          rm -rf __MACOSX
          find . -name "._*" -delete

          # 2. 将工程重命名为纯英文无空格路径
          PKG_FILE=$(find . -name "Package.swift" -not -path "*/.*" -not -path "*/__MACOSX*" | head -n 1)
          if [ -z "$PKG_FILE" ]; then
            echo "❌ 错误：未找到 Package.swift"
            exit 1
          fi
          ORIG_DIR=$(dirname "$PKG_FILE")
          mv "$ORIG_DIR" ./CleanApp.swiftpm
          cd ./CleanApp.swiftpm

          # 3. 清理重复的 Assets.xcassets
          find . -name "Assets.xcassets" | tail -n +2 | while IFS= read -r dup; do rm -rf "$dup"; done

          # 4. 🔧 自动修复代码中的编译问题：
          # (a) 修复 WidgetFanFolder.swift:474 编译器类型推断超时 (核心报错！)
          if [ -f "Widgets/WidgetFanFolder.swift" ]; then
            sed -i '' 's/\.fill(\.ultraThinMaterial\.opacity(0\.55))/\.fill(\.ultraThinMaterial)\.opacity(0.55)/g' "Widgets/WidgetFanFolder.swift"
          fi

          # (b) 修复 WidgetKoreanSheet.swift 与 WidgetBubbleSheet.swift 中同名 private struct 符号冲突
          if [ -f "Widgets/WidgetKoreanSheet.swift" ]; then
            sed -i '' 's/IOSNativeGroupedCard/KR_IOSNativeGroupedCard/g' "Widgets/WidgetKoreanSheet.swift"
            sed -i '' 's/IOSNativeSubBox/KR_IOSNativeSubBox/g' "Widgets/WidgetKoreanSheet.swift"
          fi

          # (c) 修复漏写 @MainActor 导致的并发重写报错
          find . -name "*.swift" -exec sed -i '' 's/^[[:space:]]*override class func register()/@MainActor override class func register()/g' {} +

          # 5. 获取 Scheme
          SCHEME=$(xcodebuild -list 2>/dev/null | sed -n '/Schemes:/,$p' | tail -n +2 | sed '/^[[:space:]]*$/q' | head -n 1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME="幼刀"
          fi
          echo "🚀 准备编译 Scheme: [$SCHEME]"

          # 6. 开始编译
          set -o pipefail
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath /tmp/youdao_build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -solver-expression-time-threshold=60" 2>&1 | tee /tmp/build.log || {
              echo "================ ❌ 详细编译错误日志 ❌ ================"
              grep -E ": error:" /tmp/build.log -B 2 -A 5 || tail -n 50 /tmp/build.log
              exit 1
            }

          # 7. 提取 .app 并注入 Bundle ID 与名字
          mkdir -p Payload
          APP_PATH=$(find /tmp/youdao_build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到 .app 产物"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/

          PLIST_PATH=$(find Payload -maxdepth 2 -name "Info.plist" | head -n 1)
          plutil -replace CFBundleIdentifier -string "com.youdong.app" "$PLIST_PATH"
          plutil -replace CFBundleName -string "幼刀" "$PLIST_PATH" || true
          plutil -replace CFBundleDisplayName -string "幼刀" "$PLIST_PATH" || true

          # 8. 打包成 IPA
          zip -r -q "$GITHUB_WORKSPACE/You.ipa" Payload
          echo "🎉 IPA 打包成功！"

      - name: 发布直装版 IPA 到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "最新编译直装版 (直接下载 IPA)"
          files: You.ipa
          token: ${{ secrets.GITHUB_TOKEN }}
