name: Build IPA (Direct Release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write 

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 自动匹配最新 Xcode 26 环境
        run: |
          # 自动搜寻系统中安装的最新 Xcode 26，防止小版本号变动导致切换失败
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "正在切换到: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: 解压、清理并开始云端编译
        run: |
          # 1. 解压所有 zip 包，并彻底干掉苹果压缩自带的 __MACOSX 隐藏垃圾文件夹
          find . -maxdepth 2 -iname "*.zip" -exec unzip -o -q "{}" \;
          rm -rf __MACOSX
          find . -name "._*" -delete

          # 2. 精准定位 Package.swift 所在目录（完美支持带空格、中文、括号的文件夹名）
          PKG_FILE=$(find . -name "Package.swift" -not -path "*/.*" -not -path "*/__MACOSX*" | head -n 1)
          if [ -z "$PKG_FILE" ]; then
            echo "❌ 错误：未找到 Package.swift 文件！"
            exit 1
          fi
          
          PKG_DIR=$(dirname "$PKG_FILE")
          echo "✅ 成功定位工程目录: $PKG_DIR"
          cd "$PKG_DIR"

          # 3. 清理可能重复的 Assets.xcassets
          find . -name "Assets.xcassets" | tail -n +2 | while IFS= read -r dup; do rm -rf "$dup"; done

          # 4. 获取完整 Scheme 名称（修复原本 awk $1 遇到空格截断的 Bug）
          SCHEME=$(xcodebuild -list 2>/dev/null | sed -n '/Schemes:/,$p' | tail -n +2 | sed '/^[[:space:]]*$/q' | head -n 1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME="幼刀"
          fi
          echo "🚀 准备编译 Scheme: [$SCHEME]"

          # 5. 执行无签名 Release 编译
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

          # 6. 提取 .app 并注入 Bundle ID 与应用名称
          mkdir -p Payload
          APP_PATH=$(find ./build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 错误：编译未生成 .app 文件！"
            exit 1
          fi
          echo "✅ 找到编译产物: $APP_PATH"
          cp -r "$APP_PATH" Payload/

          PLIST_PATH=$(find Payload -maxdepth 2 -name "Info.plist" | head -n 1)
          plutil -replace CFBundleIdentifier -string "com.youdong.app" "$PLIST_PATH"
          plutil -replace CFBundleName -string "幼刀" "$PLIST_PATH" || true
          plutil -replace CFBundleDisplayName -string "幼刀" "$PLIST_PATH" || true

          # 7. 打包成 IPA
          zip -r -q "$GITHUB_WORKSPACE/You.ipa" Payload
          echo "🎉 IPA 打包完成！"

      - name: 发布直装版 IPA 到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "最新编译直装版 (直接下载 IPA)"
          files: You.ipa
          token: ${{ secrets.GITHUB_TOKEN }}
